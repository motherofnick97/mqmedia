<form class="form-horizontal" autocomplete="off" #editForm="ngForm" (ngSubmit)="save()">
    <abp-modal-header title="Chỉnh sửa KOL hợp đồng" (onCloseClick)="bsModalRef.hide()"></abp-modal-header>
    <div class="modal-body">

        <div class="form-group row">
            <label class="col-md-3 col-form-label">Hợp đồng</label>
            <div class="col-md-9">
                <p-select name="contract" [(ngModel)]="entry.contractId"
                    [options]="contracts" optionLabel="name" optionValue="id"
                    [placeholder]="'-- Chọn hợp đồng --'" [style]="{'width':'100%'}">
                </p-select>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label">KOL</label>
            <div class="col-md-9">
                <p-select name="kol" [(ngModel)]="entry.kolId"
                    [options]="kols" optionLabel="name" optionValue="id"
                    [placeholder]="'-- Chọn KOL --'" [style]="{'width':'100%'}">
                </p-select>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label">Trạng thái</label>
            <div class="col-md-9">
                <p-select name="status" [(ngModel)]="entry.status"
                    [options]="statusOptions" optionLabel="label" optionValue="value"
                    [style]="{'width':'100%'}">
                </p-select>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label">Cash</label>
            <div class="col-md-9">
                <p-inputnumber name="cash" [(ngModel)]="entry.cash" [min]="0" mode="decimal" [fluid]="true"></p-inputnumber>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label">Payment</label>
            <div class="col-md-9">
                <p-inputnumber name="payment" [(ngModel)]="entry.payment" [min]="0" mode="decimal" [fluid]="true"></p-inputnumber>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label">Air Time</label>
            <div class="col-md-9">
                <p-datepicker name="airTime" [(ngModel)]="airTime"
                    dateFormat="dd/mm/yy" [showIcon]="true" [showButtonBar]="true" [fluid]="true">
                </p-datepicker>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label">Brief</label>
            <div class="col-md-9">
                <textarea pTextarea name="brief" rows="2" [(ngModel)]="entry.brief" style="width:100%"></textarea>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label">Demo Link</label>
            <div class="col-md-9">
                <input pInputText type="text" name="demoLink" [(ngModel)]="entry.demoLink" style="width:100%" />
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label">Chân dung</label>
            <div class="col-md-9">
                <input pInputText type="text" name="portrait" [(ngModel)]="entry.portrait" style="width:100%" />
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label">Góc Review</label>
            <div class="col-md-9">
                <input pInputText type="text" name="reviewCorner" [(ngModel)]="entry.reviewCorner" style="width:100%" />
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label">Sample Name</label>
            <div class="col-md-9">
                <input pInputText type="text" name="sampleName" [(ngModel)]="entry.sampleName" style="width:100%" />
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label">Sample Size</label>
            <div class="col-md-9">
                <input pInputText type="text" name="sampleSize" [(ngModel)]="entry.sampleSize" style="width:100%" />
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label">Sample Qty</label>
            <div class="col-md-9">
                <p-inputnumber name="sampleQuantity" [(ngModel)]="entry.sampleQuantity" [min]="0" mode="decimal" [fluid]="true"></p-inputnumber>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label">Sample Receive</label>
            <div class="col-md-9">
                <p-select name="sampleReceiveStatus" [(ngModel)]="entry.sampleReceiveStatus"
                    [options]="receiveStatusOptions" optionLabel="label" optionValue="value"
                    [placeholder]="'-- Chọn --'" [style]="{'width':'100%'}">
                </p-select>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label">Caption</label>
            <div class="col-md-9">
                <textarea pTextarea name="caption" rows="2" [(ngModel)]="entry.caption" style="width:100%"></textarea>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label">HashTag</label>
            <div class="col-md-9">
                <input pInputText type="text" name="hashTag" [(ngModel)]="entry.hashTag" style="width:100%" />
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label">Feedback</label>
            <div class="col-md-9">
                <textarea pTextarea name="feedback" rows="2" [(ngModel)]="entry.feedback" style="width:100%"></textarea>
            </div>
        </div>

    </div>
    <div class="modal-footer">
        <p-button [label]="'Cancel' | localize" severity="secondary" [disabled]="saving" (onClick)="bsModalRef.hide()"></p-button>
        <p-button [label]="'Save' | localize" [disabled]="!editForm.form.valid || saving" [loading]="saving" (onClick)="save()"></p-button>
    </div>
</form>
