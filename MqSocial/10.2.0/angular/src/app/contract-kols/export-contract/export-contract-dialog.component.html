<form class="form-horizontal" autocomplete="off" #exportContractModal="ngForm" (ngSubmit)="export()">
    <abp-modal-header [title]="'ExportContract' | localize" (onCloseClick)="bsModalRef.hide()"></abp-modal-header>
    <div class="modal-body">
        <div class="form-group row required">
            <label class="col-md-4 col-form-label">{{ 'ContractTemplate' | localize }}</label>
            <div class="col-md-8">
                <p-select name="template" inputId="template" [(ngModel)]="contractTemplateId"
                    [options]="templates" optionLabel="name" optionValue="id"
                    [filter]="true" filterBy="name"
                    placeholder="-- Chọn mẫu hợp đồng --"
                    [style]="{'width':'100%'}">
                </p-select>
            </div>
        </div>
        <div class="form-group row">
            <label class="col-md-4 col-form-label" for="contractNumber">Số hợp đồng</label>
            <div class="col-md-8">
                <input pInputText type="text" name="contractNumber" id="contractNumber"
                    [(ngModel)]="contractNumber" style="width: 100%" />
            </div>
        </div>
        <div class="form-group row">
            <label class="col-md-4 col-form-label">Ngày ký</label>
            <div class="col-md-8">
                <p-datepicker name="signedDate" [(ngModel)]="signedDate" dateFormat="dd/mm/yy" [showIcon]="true" [fluid]="true"></p-datepicker>
            </div>
        </div>
        <div class="form-group row">
            <label class="col-md-4 col-form-label">Thời hạn (số ngày)</label>
            <div class="col-md-8">
                <p-inputnumber name="durationDays" [(ngModel)]="durationDays" [min]="0" mode="decimal" [fluid]="true"></p-inputnumber>
            </div>
        </div>
        <div class="form-group row">
            <label class="col-md-4 col-form-label">CCCD ngày cấp</label>
            <div class="col-md-8">
                <p-datepicker name="cccdIssueDate" [(ngModel)]="cccdIssueDate" dateFormat="dd/mm/yy" [showIcon]="true" [showButtonBar]="true" [fluid]="true"></p-datepicker>
            </div>
        </div>
        <div class="form-group row">
            <label class="col-md-4 col-form-label" for="cccdIssuePlace">CCCD nơi cấp</label>
            <div class="col-md-8">
                <input pInputText type="text" name="cccdIssuePlace" id="cccdIssuePlace"
                    [(ngModel)]="cccdIssuePlace" style="width: 100%" />
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <p-button
            [label]="'Cancel' | localize"
            severity="secondary"
            [disabled]="exporting"
            (onClick)="bsModalRef.hide()">
        </p-button>
        <p-button
            [label]="'Export' | localize"
            [disabled]="!exportContractModal.form.valid || exporting"
            [loading]="exporting"
            (onClick)="export()">
        </p-button>
    </div>
</form>
