<form class="form-horizontal" autocomplete="off" #createCampaignModal="ngForm" (ngSubmit)="save()">
    <abp-modal-header [title]="'CreateNewCampaign' | localize" (onCloseClick)="bsModalRef.hide()"></abp-modal-header>
    <div class="modal-body">
        <div class="form-group row required">
            <label class="col-md-3 col-form-label" for="name">{{ 'Name' | localize }}</label>
            <div class="col-md-9">
                <input
                    pInputText
                    type="text"
                    name="name"
                    id="name"
                    required
                    maxlength="256"
                    [(ngModel)]="campaign.name"
                    #nameModel="ngModel"
                    #nameEl
                    style="width: 100%" />
                <abp-validation-summary [control]="nameModel" [controlEl]="nameEl"></abp-validation-summary>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label" for="description">{{ 'Description' | localize }}</label>
            <div class="col-md-9">
                <textarea
                    pTextarea
                    name="description"
                    id="description"
                    rows="3"
                    maxlength="5000"
                    [(ngModel)]="campaign.description"
                    style="width: 100%"></textarea>
            </div>
        </div>

        <div class="form-group row required">
            <label class="col-md-3 col-form-label" for="startDate">{{ 'StartDate' | localize }}</label>
            <div class="col-md-9">
                <p-datepicker
                    name="startDate"
                    inputId="startDate"
                    [(ngModel)]="startDate"
                    required
                    dateFormat="dd/mm/yy"
                    [showIcon]="true"
                    [showButtonBar]="true"
                    [fluid]="true"
                    #startDateModel="ngModel"
                    #startDateEl>
                </p-datepicker>
                <abp-validation-summary [control]="startDateModel" [controlEl]="startDateEl"></abp-validation-summary>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label" for="endDate">{{ 'EndDate' | localize }}</label>
            <div class="col-md-9">
                <p-datepicker
                    name="endDate"
                    inputId="endDate"
                    [(ngModel)]="endDate"
                    dateFormat="dd/mm/yy"
                    [showIcon]="true"
                    [showButtonBar]="true"
                    [fluid]="true">
                </p-datepicker>
            </div>
        </div>

        <div class="form-group row required">
            <label class="col-md-3 col-form-label" for="status">{{ 'Status' | localize }}</label>
            <div class="col-md-9">
                <p-select
                    name="status"
                    inputId="status"
                    [(ngModel)]="campaign.status"
                    [options]="campaignStatuses"
                    optionLabel="label"
                    optionValue="value"
                    [style]="{'width': '100%'}">
                </p-select>
            </div>
        </div>

        <div class="form-group row required">
            <label class="col-md-3 col-form-label" for="companyId">{{ 'Company' | localize }}</label>
            <div class="col-md-9">
                <p-select
                    name="companyId"
                    inputId="companyId"
                    required
                    [(ngModel)]="campaign.companyId"
                    [options]="companies"
                    optionLabel="name"
                    optionValue="id"
                    [placeholder]="'-- ' + ('SelectCompany' | localize) + ' --'"
                    [style]="{'width': '100%'}"
                    #companyIdModel="ngModel"
                    #companyIdEl>
                </p-select>
                <abp-validation-summary [control]="companyIdModel" [controlEl]="companyIdEl"></abp-validation-summary>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label" for="budget">{{ 'Budget' | localize }}</label>
            <div class="col-md-9">
                <p-inputnumber
                    name="budget"
                    inputId="budget"
                    [(ngModel)]="campaign.budget"
                    [min]="0"
                    mode="decimal"
                    [fluid]="true">
                </p-inputnumber>
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <p-button
            [label]="'Cancel' | localize"
            severity="secondary"
            [disabled]="saving"
            (onClick)="bsModalRef.hide()">
        </p-button>
        <p-button
            [label]="'Save' | localize"
            [disabled]="!createCampaignModal.form.valid || saving"
            [loading]="saving"
            (onClick)="save()">
        </p-button>
    </div>
</form>
