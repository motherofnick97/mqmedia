<abp-modal-header [title]="'Thêm ' + kolName + ' vào hợp đồng'" (onCloseClick)="bsModalRef.hide()"></abp-modal-header>

<div class="modal-body">

    @if (loading) {
        <div class="text-center py-3">
            <i class="pi pi-spin pi-spinner" style="font-size: 1.5rem"></i>
        </div>
    } @else {

        <!-- Form thêm mới -->
        <div class="border rounded p-3 mb-3" style="background: #f8f9fa">
            <div class="font-weight-bold mb-2">Thêm vào hợp đồng</div>
            <div class="row" style="row-gap: 0.5rem">
                <div class="col-md-6">
                    <label class="small mb-1 d-block">Hợp đồng <span class="text-danger">*</span></label>
                    <p-select
                        [(ngModel)]="selectedContractId"
                        [options]="contractOptions"
                        optionLabel="label"
                        optionValue="value"
                        placeholder="Chọn hợp đồng..."
                        [fluid]="true"
                        [panelStyle]="{'z-index': '1100'}">
                    </p-select>
                </div>
                <div class="col-md-6">
                    <label class="small mb-1 d-block">Trạng thái</label>
                    <!-- <p-select name="career" inputId="career" [(ngModel)]="kol.career"
                        [options]="careerOptions" optionLabel="label" optionValue="value"
                        [placeholder]="'-- Chọn nghề nghiệp --'"
                        [style]="{'width':'100%'}">
                    </p-select> -->
                    <p-select
                        [(ngModel)]="selectedStatus"
                        [options]="statusOptions"
                        optionLabel="label"
                        optionValue="value"
                        [fluid]="true"
                        [panelStyle]="{'z-index': '1100'}">
                    </p-select>
                </div>
            </div>
            <div class="mt-2">
                <p-button
                    label="Thêm"
                    icon="pi pi-plus"
                    [loading]="saving"
                    [disabled]="!selectedContractId"
                    (onClick)="add()">
                </p-button>
            </div>
        </div>

        <!-- Danh sách hợp đồng hiện tại -->
        <div class="font-weight-bold mb-2">
            Hợp đồng hiện tại
            <span class="badge badge-secondary ml-1">{{ existingList.length }}</span>
        </div>

        @if (existingList.length === 0) {
            <p class="text-muted small">KOL chưa tham gia hợp đồng nào.</p>
        } @else {
            <table class="table table-sm table-bordered table-striped">
                <thead class="thead-light">
                    <tr>
                        <th>Hợp đồng</th>
                        <th style="width: 150px">Trạng thái</th>
                        <th style="width: 60px"></th>
                    </tr>
                </thead>
                <tbody>
                    @for (item of existingList; track item.id) {
                        <tr>
                            <td>{{ getContractName(item.contractId) }}</td>
                            <td>
                                <p-tag
                                    [severity]="getStatusSeverity(item.status)"
                                    [value]="getStatusLabel(item.status)">
                                </p-tag>
                            </td>
                            <td>
                                <p-button
                                    icon="pi pi-trash"
                                    size="small"
                                    severity="danger"
                                    [text]="true"
                                    pTooltip="Xóa khỏi hợp đồng"
                                    tooltipPosition="top"
                                    (onClick)="remove(item)">
                                </p-button>
                            </td>
                        </tr>
                    }
                </tbody>
            </table>
        }

    }

</div>

<div class="modal-footer">
    <p-button label="Đóng" severity="secondary" (onClick)="bsModalRef.hide()"></p-button>
</div>
