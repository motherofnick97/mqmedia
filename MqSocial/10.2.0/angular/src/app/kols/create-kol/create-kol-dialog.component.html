<form class="form-horizontal" autocomplete="off" #createKolModal="ngForm" (ngSubmit)="save()">
    <abp-modal-header [title]="'CreateNewKol' | localize" (onCloseClick)="bsModalRef.hide()"></abp-modal-header>
    <div class="modal-body">

        <div class="form-group row required">
            <label class="col-md-3 col-form-label" for="name">{{ 'Name' | localize }}</label>
            <div class="col-md-9">
                <input pInputText type="text" name="name" id="name" required maxlength="256"
                    [(ngModel)]="kol.name" #nameModel="ngModel" #nameEl style="width:100%" />
                <abp-validation-summary [control]="nameModel" [controlEl]="nameEl"></abp-validation-summary>
            </div>
        </div>

        <div class="form-group row required">
            <label class="col-md-3 col-form-label" for="accountId">Account ID</label>
            <div class="col-md-9">
                <input pInputText type="text" name="accountId" id="accountId" required maxlength="256"
                    [(ngModel)]="kol.accountId" #accountIdModel="ngModel" #accountIdEl style="width:100%" />
                <abp-validation-summary [control]="accountIdModel" [controlEl]="accountIdEl"></abp-validation-summary>
            </div>
        </div>

        <div class="form-group row required">
            <label class="col-md-3 col-form-label" for="channel">{{ 'Channel' | localize }}</label>
            <div class="col-md-9">
                <p-select name="channel" inputId="channel" required [(ngModel)]="kol.channel"
                    [options]="channelOptions" optionLabel="label" optionValue="value"
                    [style]="{'width':'100%'}"
                    #channelModel="ngModel" #channelEl>
                </p-select>
                <abp-validation-summary [control]="channelModel" [controlEl]="channelEl"></abp-validation-summary>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label" for="career">{{ 'Career' | localize }}</label>
            <div class="col-md-9">
                <p-select name="career" inputId="career" [(ngModel)]="kol.career"
                    [options]="careerOptions" optionLabel="label" optionValue="value"
                    [placeholder]="'-- Chọn nghề nghiệp --'"
                    [style]="{'width':'100%'}">
                </p-select>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label" for="link">Link</label>
            <div class="col-md-9">
                <input pInputText type="text" name="link" id="link" maxlength="256"
                    [(ngModel)]="kol.link" style="width:100%" />
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label" for="follow">Follow</label>
            <div class="col-md-9">
                <p-inputnumber name="follow" inputId="follow" [(ngModel)]="kol.follow"
                    [min]="0" mode="decimal" [fluid]="true">
                </p-inputnumber>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label" for="generalCast">General Cast</label>
            <div class="col-md-9">
                <p-inputnumber name="generalCast" inputId="generalCast" [(ngModel)]="kol.generalCast"
                    [min]="0" mode="decimal" [fluid]="true">
                </p-inputnumber>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label" for="endDate">{{ 'EndDate' | localize }}</label>
            <div class="col-md-9">
                <p-datepicker name="endDate" inputId="endDate" [(ngModel)]="endDate"
                    dateFormat="dd/mm/yy" [showIcon]="true" [showButtonBar]="true" [fluid]="true">
                </p-datepicker>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label" for="note">{{ 'Note' | localize }}</label>
            <div class="col-md-9">
                <textarea pTextarea name="note" id="note" rows="3" maxlength="5000"
                    [(ngModel)]="kol.note" style="width:100%"></textarea>
            </div>
        </div>

    </div>
    <div class="modal-footer">
        <p-button [label]="'Cancel' | localize" severity="secondary" [disabled]="saving"
            (onClick)="bsModalRef.hide()"></p-button>
        <p-button [label]="'Save' | localize" [disabled]="!createKolModal.form.valid || saving"
            [loading]="saving" (onClick)="save()"></p-button>
    </div>
</form>
