<form class="form-horizontal" autocomplete="off" #createContractModal="ngForm" (ngSubmit)="save()">
    <abp-modal-header [title]="'CreateNewContract' | localize" (onCloseClick)="bsModalRef.hide()"></abp-modal-header>
    <div class="modal-body">

        <div class="form-group row required">
            <label class="col-md-3 col-form-label" for="name">{{ 'Name' | localize }}</label>
            <div class="col-md-9">
                <input pInputText type="text" name="name" id="name" required maxlength="256"
                    [(ngModel)]="contract.name" #nameModel="ngModel" #nameEl style="width:100%" />
                <abp-validation-summary [control]="nameModel" [controlEl]="nameEl"></abp-validation-summary>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label" for="campaign">{{ 'Campaign' | localize }}</label>
            <div class="col-md-9">
                <p-select name="campaign" inputId="campaign" [(ngModel)]="contract.campaignId"
                    [options]="campaigns" optionLabel="name" optionValue="id"
                    [placeholder]="'-- Chọn chiến dịch --'"
                    [style]="{'width':'100%'}">
                </p-select>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label" for="status">{{ 'Status' | localize }}</label>
            <div class="col-md-9">
                <p-select name="status" inputId="status" [(ngModel)]="contract.status"
                    [options]="contractStatuses" optionLabel="label" optionValue="value"
                    [style]="{'width':'100%'}">
                </p-select>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label" for="productName">Tên sản phẩm</label>
            <div class="col-md-9">
                <input pInputText type="text" name="productName" id="productName"
                    [(ngModel)]="contract.productName" style="width:100%" />
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label" for="budget">{{ 'Budget' | localize }}</label>
            <div class="col-md-9">
                <p-inputnumber name="budget" inputId="budget" [(ngModel)]="contract.budget"
                    [min]="0" mode="decimal" [fluid]="true">
                </p-inputnumber>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label" for="maxReviewTime">Số lần review tối đa</label>
            <div class="col-md-9">
                <p-inputnumber name="maxReviewTime" inputId="maxReviewTime" [(ngModel)]="contract.maxReviewTime"
                    [min]="0" mode="decimal" [fluid]="true">
                </p-inputnumber>
                <small class="text-muted">Số lần tối đa có thể cập nhật kết quả review cho mỗi KOL trong hợp đồng này.</small>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label" for="request">Request</label>
            <div class="col-md-9">
                <textarea pTextarea name="request" id="request" rows="3"
                    [(ngModel)]="contract.request" style="width:100%"></textarea>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label" for="script">Script</label>
            <div class="col-md-9">
                <textarea pTextarea name="script" id="script" rows="3"
                    [(ngModel)]="contract.script" style="width:100%"></textarea>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label">Không trùng KOL với</label>
            <div class="col-md-9">
                <p-multiselect
                    [(ngModel)]="duplicateContractIds"
                    name="duplicateContracts"
                    [options]="contracts"
                    optionLabel="name"
                    optionValue="id"
                    [filter]="true"
                    filterPlaceholder="Tìm hợp đồng..."
                    placeholder="-- Chọn hợp đồng --"
                    [style]="{'width':'100%'}">
                </p-multiselect>
                <small class="text-muted">KOL đã có trong các hợp đồng này sẽ không được thêm vào hợp đồng mới.</small>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label" for="note">{{ 'Note' | localize }}</label>
            <div class="col-md-9">
                <textarea pTextarea name="note" id="note" rows="3" maxlength="5000"
                    [(ngModel)]="contract.note" style="width:100%"></textarea>
            </div>
        </div>

    </div>
    <div class="modal-footer">
        <p-button [label]="'Cancel' | localize" severity="secondary" [disabled]="saving"
            (onClick)="bsModalRef.hide()"></p-button>
        <p-button [label]="'Save' | localize" [disabled]="!createContractModal.form.valid || saving"
            [loading]="saving" (onClick)="save()"></p-button>
    </div>
</form>
